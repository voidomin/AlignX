<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded squircle container with Editorial Instrument ground & border -->
  <rect width="64" height="64" rx="14" fill="#14110E"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#2C2620" stroke-width="1.5"/>
  
  <!-- Optical alignment reticle ticks (StructScope) -->
  <line x1="32" y1="9" x2="32" y2="14" stroke="#EDE7DC" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="32" y1="50" x2="32" y2="55" stroke="#EDE7DC" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="9" y1="32" x2="14" y2="32" stroke="#EDE7DC" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="50" y1="32" x2="55" y2="32" stroke="#EDE7DC" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
  
  <!-- Coordinate scope ring -->
  <circle cx="32" cy="32" r="9.5" fill="none" stroke="#EDE7DC" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="2.5 2"/>
  
  <!-- Structural Chain 2 backbone ribbon (Amber gold #F59E0B) -->
  <path d="M 48 16 C 41 21, 37 27, 32 32 C 27 37, 23 43, 16 48" fill="none" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Structural Chain 1 backbone ribbon (Signature Coral #E2846A) -->
  <path d="M 16 16 C 23 21, 27 27, 32 32 C 37 37, 41 43, 48 48" fill="none" stroke="#E2846A" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Terminal atom coordinate spheres -->
  <circle cx="16" cy="16" r="3.5" fill="#E2846A"/>
  <circle cx="48" cy="48" r="3.5" fill="#E2846A"/>
  <circle cx="48" cy="16" r="3.5" fill="#F59E0B"/>
  <circle cx="16" cy="48" r="3.5" fill="#F59E0B"/>
  
  <!-- Central alignment convergence node -->
  <circle cx="32" cy="32" r="5" fill="#14110E" stroke="#EDE7DC" stroke-width="2"/>
  <circle cx="32" cy="32" r="2.5" fill="#E2846A"/>
</svg>